# Server
server.port=8080
spring.application.name=meeting-scheduler

# Database
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/meeting_scheduler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_DB_PASSWORD

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=YOUR_64_CHAR_SECRET_KEY_CHANGE_THIS_IN_PRODUCTION
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=noreply@meetscheduler.com

# Google OAuth2
google.client.id=YOUR_GOOGLE_CLIENT_ID
google.client.secret=YOUR_GOOGLE_CLIENT_SECRET
google.redirect.uri=http://localhost:3000/calendar/google/callback

# Microsoft (not used)
microsoft.client.id=not-configured
microsoft.client.secret=not-configured
microsoft.tenant.id=common
microsoft.redirect.uri=http://localhost:3000/calendar/outlook/callback

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.meetscheduler=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN